<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cellendar">
  <title>Cellendar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/cellendar-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img src="icons/cellendar-icon.png" alt=""><div><strong>Cellendar</strong><span>Excel × Calendar</span></div></div>
      <div class="actions"><button id="todayBtn" class="icon-btn" aria-label="오늘">오늘</button><button id="syncBtn" class="icon-btn sync" aria-label="동기화"><i id="syncDot"></i>↻</button><button id="accountBtn" class="avatar" aria-label="계정">사람</button></div>
    </header>

    <main>
      <section id="calendarView">
        <div class="month-nav"><button id="prevBtn" aria-label="이전 달">‹</button><h1 id="monthTitle"></h1><button id="nextBtn" aria-label="다음 달">›</button></div>
        <div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </section>

      <section id="welcomeView" class="welcome hidden">
        <img src="icons/cellendar-icon.png" alt="Cellendar">
        <h1>엑셀과 휴대폰 캘린더를 하나로</h1>
        <p>Microsoft 계정으로 연결하면 본인의 OneDrive 파일만 안전하게 동기화됩니다.</p>
        <button id="loginBtn" class="primary">Microsoft 계정으로 시작</button>
        <small>일정은 GitHub에 저장되지 않습니다.</small>
      </section>
    </main>

    <div id="daySheet" class="sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-card"><div class="handle"></div><div class="sheet-head"><div><small id="dayWeekday"></small><h2 id="dayTitle"></h2></div><button id="closeDayBtn" class="close">×</button></div><div id="dayEvents"></div><button id="addBtn" class="primary full">+ 일정 추가</button></div>
    </div>

    <div id="eventModal" class="sheet hidden" role="dialog" aria-modal="true">
      <form id="eventForm" class="sheet-card form-card"><div class="handle"></div><div class="sheet-head"><h2 id="formTitle">일정 추가</h2><button type="button" id="closeFormBtn" class="close">×</button></div>
        <input type="hidden" id="eventId"><label>날짜<input id="eventDate" type="date" required></label><label>제목<input id="eventTitle" maxlength="120" required placeholder="일정 제목"></label><label>메모<textarea id="eventMemo" rows="3" maxlength="1000" placeholder="메모 (선택)"></textarea></label><div class="two"><label>색상<input id="eventColor" type="color" value="#4f8ef7"></label><label>알림 시각<input id="eventAlarm" type="time"></label></div><div class="form-actions"><button type="button" id="deleteBtn" class="danger hidden">삭제</button><button type="submit" class="primary">저장</button></div>
      </form>
    </div>

    <div id="accountPanel" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-card"><div class="handle"></div><div class="sheet-head"><h2>계정 및 동기화</h2><button id="closeAccountBtn" class="close">×</button></div><div id="accountInfo" class="account-info"></div><div id="connectionStatus" class="status"></div><button id="panelSyncBtn" class="primary full">지금 동기화</button><button id="templateBtn" class="secondary full">엑셀 템플릿 다운로드</button><button id="logoutBtn" class="text-btn full">로그아웃</button></div></div>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script src="vendor/msal-browser.min.js"></script>
  <script src="config.js"></script><script src="storage.js"></script><script src="sync.js"></script><script src="app.js"></script>
</body>
</html>
